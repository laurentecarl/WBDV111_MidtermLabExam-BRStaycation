<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | BR Staycation</title>
    <link rel="icon" type="image/x-icon" href="Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="gallery-page">

<header>
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="Logo.png" alt="Logo" class="navbar-logo">
            <h1>BR Staycation</h1>
        </div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contacts.html">Contact Us</a></li>
            <li><a href="feedback.html">Feedback</a></li>
            <li><a href="booking.html" class="book-btn">Book Now</a></li>
        </ul>
    </nav>
</header>

<section class="gallery-section">
    <h2>Our Staycation Gallery</h2>
    <div class="gallery-grid gallery-layout">
        <div class="gallery-card gallery-card-large">
            <img src="roominc2.jpg" alt="Room 1" data-index="0">
        </div>
        <div class="gallery-right-grid">
            <div class="gallery-card gallery-card-small">
                <img src="brstay3.jpg" alt="Room 1 Kitchen" data-index="1">
            </div>
            <div class="gallery-card gallery-card-small">
                <img src="gal5.jpg" alt="Room 2" data-index="2">
            </div>
            <div class="gallery-card gallery-card-small">
                <img src="gal7.jpg" alt="Room 2 Lounge" data-index="3">
            </div>
            <div class="gallery-card gallery-card-more" id="galleryMoreTile">
                <span>Show all photos</span>
            </div>
        </div>
    </div>
</section>

<div id="galleryModal" class="gallery-modal">
    <span class="gallery-close">&times;</span>
    <button class="gallery-nav gallery-prev" aria-label="Previous">&#10094;</button>
    <img class="gallery-modal-content" id="galleryModalImg" alt="Gallery Image">
    <button class="gallery-nav gallery-next" aria-label="Next">&#10095;</button>
</div>

<script src="script.js"></script>

<footer>
    <div class="footer-content">
        <h3>BR Staycation</h3>
        <p>Relax, Explore, and Enjoy Local Stays</p>
        <div class="footer-contact">
            <p>📞 +63 915 859 6397</p>
            <p>✉️ brtag2020@gmail.com</p>
        </div>
    </div>
    <p class="copyright">© 2024 BR Staycation | All Rights Reserved</p>
</footer>

</body>
</html>
